name: order_live_card
description: The live order card in the Android notification bar, drawn with a native layout that matches the app's home order card.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.codeharbor.orderlivecard
        pluginClass: OrderLiveCardPlugin
